<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>crime</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Player de áudio invisível -->
    <div id="youtube-player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <script>
      // Carrega a API do YouTube
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-player', {
          height: '1',
          width: '1',
          videoId: 'ySCAq0EabOs', // Substitua pelo ID da música no YouTube
          playerVars: {
            'autoplay': 0,
            'controls': 0,
            'loop': 1,
            'playlist': 'ySCAq0EabOs', // Necessário para loop
            'disablekb': 1,
            'fs': 0,
            'modestbranding': 1,
            'iv_load_policy': 3
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }

      function onPlayerReady(event) {
        // Player pronto, aguardando clique do usuário
      }

      function onPlayerStateChange(event) {
        // Se o vídeo terminar, reinicia (para garantir o loop)
        if (event.data === YT.PlayerState.ENDED) {
          player.playVideo();
        }
      }

      document.addEventListener('click', function() {
        if (player && player.playVideo) {
          player.playVideo();
          player.setVolume(50); // Volume de 0 a 100
        }
      });
    </script>
  </body>
</html>
